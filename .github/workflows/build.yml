name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk
        pip install buildozer cython
    
    - name: Build APK
      run: |
        buildozer init
        
        # Настраиваем buildozer.spec
        sed -i 's/# requirements = python3,kivy/requirements = python3,kivy,kivymd/' buildozer.spec
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/title = My Application/title = Shopping List/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = shoppinglist/' buildozer.spec
        sed -i 's/package.domain = org.example/package.domain = com.mymmya/' buildozer.spec
        
        # Принимаем лицензию Android SDK
        echo "y" | buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app
        path: bin/*.apk
