name: Build APK with Docker

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: kivy/buildozer:ci

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build APK
      run: |
        # Инициализируем конфиг
        buildozer init
        
        # Правим buildozer.spec под ваш проект
        sed -i 's/title = My Application/title = Shopping List/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = shoppinglist/' buildozer.spec
        sed -i 's/package.domain = org.example/package.domain = com.mymmya/' buildozer.spec
        sed -i 's/# requirements = python3,kivy/requirements = python3,kivy==2.1.0,kivymd==1.1.1/' buildozer.spec
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        
        # ЗАПУСКАЕМ СБОРКУ
        buildozer android debug
        
        # Проверяем, создался ли APK
        ls -la bin/

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: shopping-list-apk
        path: bin/*.apk
        if-no-files-found: error
