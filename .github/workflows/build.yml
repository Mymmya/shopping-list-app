name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          openjdk-17-jdk \
          git \
          zip \
          unzip \
          wget \
          libncurses5 \
          libstdc++6 \
          zlib1g-dev \
          libffi-dev \
          libssl-dev
    
    - name: Install buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.19
    
    - name: Create buildozer.spec
      run: |
        buildozer init
        # Редактируем buildozer.spec через sed
        sed -i 's/# requirements = python3,kivy/requirements = python3,kivy==2.1.0,kivymd==1.1.1/' buildozer.spec
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/# android.ndk = 19c/android.ndk = 25c/' buildozer.spec
        sed -i 's/# android.sdk = 29/android.sdk = 30/' buildozer.spec
        sed -i 's/# android.api = 30/android.api = 30/' buildozer.spec
        sed -i 's/# android.minapi = 21/android.minapi = 24/' buildozer.spec
        sed -i 's/# log_level = 2/log_level = 2/' buildozer.spec
        sed -i 's/# orientation = landscape/orientation = portrait/' buildozer.spec
        sed -i 's/# fullscreen = 0/fullscreen = 0/' buildozer.spec
        # Добавляем permissions
        echo "android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE" >> buildozer.spec
        # Добавляем название приложения
        sed -i 's/title = My Application/title = Shopping List/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = shoppinglist/' buildozer.spec
        sed -i 's/package.domain = org.example/package.domain = com.mymmya/' buildozer.spec
        
    - name: Build APK
      run: |
        buildozer android debug 2>&1 | tee build.log
    
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: shopping-list-apk
        path: bin/*.apk
    
    - name: Upload build log if failed
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: build-log
        path: build.log
